name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder values only. Tests mock external services; build needs env
    # values that pass application validation but does not use real credentials.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-auth-secret-that-is-at-least-32-characters-long
      AUTH_GITHUB_ID: ci-github-id
      AUTH_GITHUB_SECRET: ci-github-secret
      ENCRYPTION_KEY: ci-encryption-key-at-least-32-characters-long
      QSTASH_URL: https://qstash.upstash.io
      QSTASH_TOKEN: ci-qstash-token
      QSTASH_CURRENT_SIGNING_KEY: ci-current-key
      QSTASH_NEXT_SIGNING_KEY: ci-next-key
      UPSTASH_REDIS_REST_URL: https://ci-redis.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-redis-token
      GEMINI_API_KEY: ci-gemini-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema and generate client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
